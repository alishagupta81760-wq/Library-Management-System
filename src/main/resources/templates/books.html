<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management - Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                📚 Library Management System
            </a>

            <a th:href="@{/}" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <div class="alert alert-success" role="alert"
             th:if="${successMessage != null}"
             th:text="${successMessage}">
        </div>

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold">Book Management</h2>
                <p class="text-muted">Manage all library books here.</p>
            </div>

            <div>
                <a th:href="@{/}" class="btn btn-dark me-2">
                    Dashboard
                </a>

                <a th:href="@{/books/add}" class="btn btn-primary">
                    + Add New Book
                </a>
            </div>

        </div>

        <!-- Search Form -->
        <form th:action="@{/books/search}" method="get" class="mb-4">

            <div class="input-group">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search book by title, author or ISBN..."
                       th:value="${keyword}">

                <input type="hidden"
                       name="size"
                       th:value="${pageSize}">

                <button type="submit" class="btn btn-success">
                    Search
                </button>

                <a th:href="@{/books}" class="btn btn-secondary">
                    Reset
                </a>

            </div>
        </form>

        <!-- Books Table -->
        <div class="card shadow-sm">
            <div class="card-body">

                <!-- Total Books -->
                <div class="d-flex justify-content-between mb-3">

                    <h5 class="fw-bold">Books List</h5>

                    <span class="badge bg-primary fs-6"
                          th:text="${'Total Books: ' + totalItems}">
                    </span>

                </div>

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Book Title</th>
                                <th>Author</th>
                                <th>ISBN</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Available</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody>

                            <!-- Display Books -->
                            <tr th:each="book : ${books.content}">

                                <td th:text="${book.id}"></td>
                                <td th:text="${book.title}"></td>
                                <td th:text="${book.author}"></td>
                                <td th:text="${book.isbn}"></td>
                                <td th:text="${book.category}"></td>
                                <td th:text="${book.quantity}"></td>
                                <td th:text="${book.availableCopies}"></td>

                                <!-- Action Buttons -->
                                <td class="text-nowrap">

                                    <a th:href="@{/books/edit/{id}(id=${book.id})}"
                                       class="btn btn-warning btn-sm">
                                        Edit
                                    </a>

                                    <a th:href="@{/books/delete/{id}(id=${book.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete this book?')">
                                        Delete
                                    </a>

                                </td>

                            </tr>

                            <!-- Empty Books Message -->
                            <tr th:if="${books.empty}">
                                <td colspan="8"
                                    class="text-center text-muted py-4">
                                    No books found. Please try another search.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

                <!-- Pagination Information -->
                <div class="d-flex justify-content-between align-items-center flex-wrap mt-3">

                    <p class="text-muted mb-2"
                       th:if="${totalItems > 0}"
                       th:text="${'Showing ' + (currentPage * pageSize + 1)
                                + ' to '
                                + (currentPage * pageSize + books.numberOfElements)
                                + ' of ' + totalItems + ' books'}">
                    </p>

                    <!-- Records Per Page -->
                    <form method="get"
                          th:action="${keyword != null and !keyword.isEmpty()} ? @{/books/search} : @{/books}"
                          class="d-flex align-items-center gap-2 mb-2">

                        <input type="hidden"
                               name="keyword"
                               th:value="${keyword}">

                        <label for="size" class="text-muted">
                            Records:
                        </label>

                        <select name="size"
                                id="size"
                                class="form-select form-select-sm"
                                onchange="this.form.submit()">

                            <option value="5" th:selected="${pageSize == 5}">5</option>
                            <option value="10" th:selected="${pageSize == 10}">10</option>
                            <option value="20" th:selected="${pageSize == 20}">20</option>
                            <option value="50" th:selected="${pageSize == 50}">50</option>

                        </select>

                    </form>

                </div>

                <!-- Pagination Buttons -->
                <nav th:if="${totalPages > 1}"
                     aria-label="Books pagination">

                    <ul class="pagination justify-content-center mt-3">

                        <!-- Previous Button -->
                        <li class="page-item"
                            th:classappend="${books.first} ? 'disabled'">

                            <a class="page-link"
                               th:href="${keyword != null and !keyword.isEmpty()} ?
                                   @{/books/search(page=${currentPage - 1}, size=${pageSize}, keyword=${keyword})} :
                                   @{/books(page=${currentPage - 1}, size=${pageSize})}">
                                Previous
                            </a>

                        </li>

                        <!-- Page Numbers -->
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${currentPage == i} ? 'active'">

                            <a class="page-link"
                               th:text="${i + 1}"
                               th:href="${keyword != null and !keyword.isEmpty()} ?
                                   @{/books/search(page=${i}, size=${pageSize}, keyword=${keyword})} :
                                   @{/books(page=${i}, size=${pageSize})}">
                            </a>

                        </li>

                        <!-- Next Button -->
                        <li class="page-item"
                            th:classappend="${books.last} ? 'disabled'">

                            <a class="page-link"
                               th:href="${keyword != null and !keyword.isEmpty()} ?
                                   @{/books/search(page=${currentPage + 1}, size=${pageSize}, keyword=${keyword})} :
                                   @{/books(page=${currentPage + 1}, size=${pageSize})}">
                                Next
                            </a>

                        </li>

                    </ul>

                </nav>

            </div>
        </div>

    </div>

</body>
</html>
