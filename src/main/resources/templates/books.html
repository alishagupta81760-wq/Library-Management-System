<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management - Books</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                📚 Library Management System
            </a>

            <a th:href="@{/}" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold">Book Management</h2>
                <p class="text-muted">Manage all library books here.</p>
            </div>

            <div>
                <a th:href="@{/}" class="btn btn-dark me-2">
                    Dashboard
                </a>

                <a th:href="@{/books/add}" class="btn btn-primary">
                    + Add New Book
                </a>
            </div>

        </div>

        <!-- Search Form -->
        <form th:action="@{/books/search}" method="get" class="mb-4">

            <div class="input-group">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search book by title..."
                       th:value="${keyword}">

                <button type="submit" class="btn btn-success">
                    Search
                </button>

                <a th:href="@{/books}" class="btn btn-secondary">
                    Reset
                </a>

            </div>

        </form>

        <!-- Books Table -->
        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">

                            <tr>
                                <th>ID</th>
                                <th>Book Title</th>
                                <th>Author</th>
                                <th>ISBN</th>
                                <th>Category</th>
                                <th>Quantity</th>
                                <th>Available</th>
                                <th>Action</th>
                            </tr>

                        </thead>

                        <tbody>

                            <!-- Display Books -->
                            <tr th:each="book : ${books}">

                                <td th:text="${book.id}"></td>
                                <td th:text="${book.title}"></td>
                                <td th:text="${book.author}"></td>
                                <td th:text="${book.isbn}"></td>
                                <td th:text="${book.category}"></td>
                                <td th:text="${book.quantity}"></td>
                                <td th:text="${book.availableCopies}"></td>

                                <!-- Action Buttons -->
                                <td class="text-nowrap">

                                    <!-- Edit Button -->
                                    <a th:href="@{/books/edit/{id}(id=${book.id})}"
                                       class="btn btn-warning btn-sm">
                                        Edit
                                    </a>

                                    <!-- Delete Button -->
                                    <a th:href="@{/books/delete/{id}(id=${book.id})}"
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('Are you sure you want to delete this book?')">
                                        Delete
                                    </a>

                                </td>

                            </tr>

                            <!-- Empty Books Message -->
                            <tr th:if="${#lists.isEmpty(books)}">

                                <td colspan="8"
                                    class="text-center text-muted py-4">

                                    No books found. Please try another search.

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
