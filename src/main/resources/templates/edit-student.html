<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student - Library Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">

        <div class="card shadow mx-auto" style="max-width: 600px;">

            <div class="card-header bg-warning">
                <h4 class="mb-0">Edit Student Details</h4>
            </div>

            <div class="card-body">

                <form th:action="@{/students/update/{id}(id=${student.id})}"
                      th:object="${student}"
                      method="post"
                      novalidate>

                    <!-- Student Name -->
                    <div class="mb-3">

                        <label class="form-label">Student Name</label>

                        <input type="text"
                               th:field="*{name}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="Enter student name">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                        </div>

                    </div>

                    <!-- Roll Number -->
                    <div class="mb-3">

                        <label class="form-label">Roll Number</label>

                        <input type="text"
                               th:field="*{rollNumber}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('rollNumber')} ? 'is-invalid'"
                               placeholder="Enter roll number">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('rollNumber')}"
                             th:errors="*{rollNumber}">
                        </div>

                    </div>

                    <!-- Email -->
                    <div class="mb-3">

                        <label class="form-label">Email</label>

                        <input type="email"
                               th:field="*{email}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="Enter email address">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}">
                        </div>

                    </div>

                    <!-- Phone -->
                    <div class="mb-3">

                        <label class="form-label">Phone</label>

                        <input type="tel"
                               th:field="*{phone}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                               placeholder="Enter 10-digit phone number">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('phone')}"
                             th:errors="*{phone}">
                        </div>

                    </div>

                    <!-- Course -->
                    <div class="mb-3">

                        <label class="form-label">Course</label>

                        <select th:field="*{course}" class="form-select">

                            <option value="">Select Course</option>
                            <option value="BCA">BCA</option>
                            <option value="MCA">MCA</option>
                            <option value="BBA">BBA</option>
                            <option value="MBA">MBA</option>
                            <option value="Other">Other</option>

                        </select>

                    </div>

                    <!-- Buttons -->
                    <button type="submit" class="btn btn-success">
                        Update Student
                    </button>

                    <a th:href="@{/students}" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>
        </div>
    </div>

</body>
</html>
