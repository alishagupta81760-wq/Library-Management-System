<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issued Books - Library Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                📚 Library Management System
            </a>

            <a th:href="@{/}" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

        </div>
    </nav>

    <div class="container mt-5">

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold">Issued Books</h2>
                <p class="text-muted">
                    Manage issued and returned books.
                </p>
            </div>

            <a th:href="@{/issued-books/issue}" class="btn btn-primary">
                + Issue New Book
            </a>

        </div>

        <!-- Success Message -->
        <div th:if="${successMessage}"
             class="alert alert-success"
             th:text="${successMessage}">
        </div>

        <!-- Error Message -->
        <div th:if="${errorMessage}"
             class="alert alert-danger"
             th:text="${errorMessage}">
        </div>

        <!-- Search and Filter Form -->
        <form th:action="@{/issued-books/search}"
              method="get"
              class="card shadow-sm mb-4">

            <div class="card-body">

                <div class="row g-3">

                    <!-- Search Box -->
                    <div class="col-md-6">

                        <label class="form-label">
                            Search Student or Book
                        </label>

                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Enter student name or book title..."
                               th:value="${keyword}">

                    </div>

                    <!-- Status Filter -->
                    <div class="col-md-3">

                        <label class="form-label">
                            Filter by Status
                        </label>

                        <select name="status" class="form-select">

                            <option value=""
                                    th:selected="${status == null or status == ''}">
                                All Status
                            </option>

                            <option value="ISSUED"
                                    th:selected="${status == 'ISSUED'}">
                                Issued
                            </option>

                            <option value="RETURNED"
                                    th:selected="${status == 'RETURNED'}">
                                Returned
                            </option>

                        </select>

                    </div>

                    <!-- Buttons -->
                    <div class="col-md-3">

                        <label class="form-label d-block">
                            Actions
                        </label>

                        <button type="submit"
                                class="btn btn-success">
                            Search
                        </button>

                        <a th:href="@{/issued-books}"
                           class="btn btn-secondary">
                            Reset
                        </a>

                    </div>

                </div>

            </div>

        </form>

        <!-- Issued Books Table -->
        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover align-middle">

                        <thead class="table-dark">

                            <tr>
                                <th>Issue ID</th>
                                <th>Student Name</th>
                                <th>Book Title</th>
                                <th>Issue Date</th>
                                <th>Due Date</th>
                                <th>Return Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>

                        </thead>

                        <tbody>

                            <!-- Display Issue Records -->
                            <tr th:each="issue : ${issuedBooks}">

                                <td th:text="${issue.id}"></td>

                                <td th:text="${issue.student.name}"></td>

                                <td th:text="${issue.book.title}"></td>

                                <td th:text="${issue.issueDate}"></td>

                                <td th:text="${issue.dueDate}"></td>

                                <td th:text="${issue.returnDate != null ? issue.returnDate : '-'}"></td>

                                <td>

                                    <span th:if="${issue.status == 'ISSUED'}"
                                          class="badge bg-warning text-dark">
                                        ISSUED
                                    </span>

                                    <span th:if="${issue.status == 'RETURNED'}"
                                          class="badge bg-success">
                                        RETURNED
                                    </span>

                                </td>

                                <td>

                                    <a th:if="${issue.status == 'ISSUED'}"
                                       th:href="@{/issued-books/return/{id}(id=${issue.id})}"
                                       class="btn btn-sm btn-success"
                                       onclick="return confirm('Are you sure this book has been returned?')">
                                        Return Book
                                    </a>

                                    <span th:if="${issue.status == 'RETURNED'}"
                                          class="text-muted">
                                        Completed
                                    </span>

                                </td>

                            </tr>

                            <!-- Empty Message -->
                            <tr th:if="${#lists.isEmpty(issuedBooks)}">

                                <td colspan="8"
                                    class="text-center text-muted py-4">

                                    No issued books found.

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Navigation -->
        <div class="mt-3">

            <a th:href="@{/}" class="btn btn-outline-dark">
                Dashboard
            </a>

            <a th:href="@{/books}" class="btn btn-outline-primary">
                Books
            </a>

            <a th:href="@{/students}" class="btn btn-outline-primary">
                Students
            </a>

        </div>

    </div>

</body>
</html>
