<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issue Book - Library Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                📚 Library Management System
            </a>

            <a th:href="@{/}" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <div class="card shadow mx-auto" style="max-width: 650px;">

            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Issue New Book</h4>
            </div>

            <div class="card-body">
            <!-- Success Message -->
<div th:if="${successMessage}"
     class="alert alert-success"
     th:text="${successMessage}">
</div>

<!-- Error Message -->
<div th:if="${errorMessage}"
     class="alert alert-danger"
     th:text="${errorMessage}">
</div>

                <form th:action="@{/issued-books/save}" method="post">

                    <!-- Select Student -->
                    <div class="mb-3">

                        <label class="form-label">Select Student</label>

                        <select name="studentId" class="form-select" required>

                            <option value="">Choose Student</option>

                            <option th:each="student : ${students}"
                                    th:value="${student.id}"
                                    th:text="${student.name + ' (' + student.rollNumber + ')'}">
                            </option>

                        </select>

                    </div>

                    <!-- Select Book -->
                    <div class="mb-3">

                        <label class="form-label">Select Book</label>

                        <select name="bookId" class="form-select" required>

                            <option value="">Choose Book</option>

                            <option th:each="book : ${books}"
                                    th:if="${book.availableCopies > 0}"
                                    th:value="${book.id}"
                                    th:text="${book.title + ' - Available: ' + book.availableCopies}">
                            </option>

                        </select>

                    </div>

                    <!-- Issue Date -->
                    <div class="mb-3">

                        <label class="form-label">Issue Date</label>

                        <input type="date"
                               class="form-control"
                               th:value="${today}"
                               readonly>

                    </div>

                    <!-- Due Date -->
                    <div class="mb-3">

                        <label class="form-label">Due Date</label>

                        <input type="date"
                               name="dueDate"
                               class="form-control"
                               th:attr="min=${today}"
                               required>

                    </div>

                    <!-- Buttons -->
                    <button type="submit" class="btn btn-success">
                        Issue Book
                    </button>

                    <a th:href="@{/issued-books}" class="btn btn-secondary">
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
