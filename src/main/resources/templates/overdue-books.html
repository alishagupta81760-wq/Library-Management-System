<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Overdue Books - Library Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                📚 Library Management System
            </a>

            <a th:href="@{/}" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <!-- Heading -->
        <div class="mb-4">
            <h2 class="fw-bold text-danger">Overdue Books</h2>

            <p class="text-muted">
                Books whose due date has passed and are not yet returned.
            </p>
        </div>

        <!-- Overdue Books Table -->
        <div class="card shadow-sm">

            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Overdue Books List</h5>
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover align-middle">

                        <thead class="table-dark">

                            <tr>
                                <th>Issue ID</th>
                                <th>Student Name</th>
                                <th>Roll Number</th>
                                <th>Book Title</th>
                                <th>Issue Date</th>
                                <th>Due Date</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>

                        </thead>

                        <tbody>

                            <!-- Display Overdue Books -->
                            <tr th:each="issue : ${overdueBooks}">

                                <td th:text="${issue.id}"></td>

                                <td th:text="${issue.student.name}"></td>

                                <td th:text="${issue.student.rollNumber}"></td>

                                <td th:text="${issue.book.title}"></td>

                                <td th:text="${issue.issueDate}"></td>

                                <td class="text-danger fw-bold"
                                    th:text="${issue.dueDate}">
                                </td>

                                <td>
                                    <span class="badge bg-danger">
                                        OVERDUE
                                    </span>
                                </td>

                                <td>
                                    <a th:href="@{/issued-books/return/{id}(id=${issue.id})}"
                                       class="btn btn-success btn-sm"
                                       onclick="return confirm('Are you sure this book has been returned?')">
                                        Return Book
                                    </a>
                                </td>

                            </tr>

                            <!-- Empty Message -->
                            <tr th:if="${#lists.isEmpty(overdueBooks)}">

                                <td colspan="8"
                                    class="text-center text-success py-4">

                                    No overdue books found!

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Navigation -->
        <div class="mt-3">

            <a th:href="@{/}" class="btn btn-outline-dark">
                Dashboard
            </a>

            <a th:href="@{/issued-books}" class="btn btn-outline-primary">
                All Issued Books
            </a>

        </div>

    </div>

</body>
</html>
