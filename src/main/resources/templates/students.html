<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management - Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" th:href="@{/}">
                📚 Library Management System
            </a>

            <a th:href="@{/}" class="btn btn-outline-light btn-sm">
                Dashboard
            </a>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        <!-- Page Heading -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
                <h2 class="fw-bold">Student Management</h2>
                <p class="text-muted">Manage all registered students here.</p>
            </div>

            <div>
                <a th:href="@{/}" class="btn btn-dark me-2">
                    Dashboard
                </a>

                <a th:href="@{/students/add}" class="btn btn-primary">
                    + Add Student
                </a>
            </div>

        </div>

        <!-- Search Form -->
        <form th:action="@{/students/search}" method="get" class="mb-4">

            <div class="input-group">

                <input type="text"
                       name="keyword"
                       class="form-control"
                       placeholder="Search student by name..."
                       th:value="${keyword}">

                <button class="btn btn-success" type="submit">
                    Search
                </button>

                <a th:href="@{/students}" class="btn btn-secondary">
                    Reset
                </a>

            </div>

        </form>

        <!-- Student Table -->
        <div class="card shadow-sm">

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover align-middle">

                        <thead class="table-dark">

                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Roll Number</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Course</th>
                                <th>Actions</th>
                            </tr>

                        </thead>

                        <tbody>

                            <!-- Display Students -->
                            <tr th:each="student : ${students}">

                                <td th:text="${student.id}"></td>
                                <td th:text="${student.name}"></td>
                                <td th:text="${student.rollNumber}"></td>
                                <td th:text="${student.email}"></td>
                                <td th:text="${student.phone}"></td>
                                <td th:text="${student.course}"></td>

                                <!-- Action Buttons -->
                                <td class="text-nowrap">

                                    <a th:href="@{/students/edit/{id}(id=${student.id})}"
                                       class="btn btn-sm btn-warning">
                                        Edit
                                    </a>

                                    <a th:href="@{/students/delete/{id}(id=${student.id})}"
                                       class="btn btn-sm btn-danger"
                                       onclick="return confirm('Are you sure you want to delete this student?')">
                                        Delete
                                    </a>

                                </td>

                            </tr>

                            <!-- Empty Students Message -->
                            <tr th:if="${#lists.isEmpty(students)}">

                                <td colspan="7" class="text-center text-muted py-4">
                                    No students found.
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Navigation Buttons -->
        <div class="mt-3">

            <a th:href="@{/books}" class="btn btn-outline-primary">
                📚 Go to Books
            </a>

            <a th:href="@{/}" class="btn btn-outline-dark">
                Dashboard
            </a>

        </div>

    </div>

</body>
</html>
